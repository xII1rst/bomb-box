<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>BombBox</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.png" />
  
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ─── MENU ─── -->
<div id="menu">
  <h1>BOMB<span>BOX</span></h1>
  <p class="subtitle">¿Quién aguanta la bomba?</p>
  <div class="divider"></div>

  <div class="row">
    <label>CUADROS<br>EN JUEGO</label>
    <div class="ctrl">
      <button class="pxbtn" onclick="adj('squares',-1)">◀</button>
      <span class="val-display" id="val-squares">8</span>
      <button class="pxbtn" onclick="adj('squares',1)">▶</button>
    </div>
  </div>

  <div class="row">
    <label>TIEMPO<br>BOMBA (s)</label>
    <div class="ctrl">
      <button class="pxbtn" onclick="adj('bombTime',-1)">◀</button>
      <span class="val-display" id="val-bombTime">5</span>
      <button class="pxbtn" onclick="adj('bombTime',1)">▶</button>
    </div>
  </div>

  <div class="row">
    <label>VELOCIDAD</label>
    <div class="ctrl">
      <button class="pxbtn" onclick="adj('speed',-1)">◀</button>
      <span class="val-display" id="val-speed">3</span>
      <button class="pxbtn" onclick="adj('speed',1)">▶</button>
    </div>
  </div>

  <div class="row">
    <label>TAMAÑO<br>MAPA</label>
    <div class="ctrl">
      <button class="pxbtn" onclick="adj('mapSize',-1)">◀</button>
      <span class="val-display" id="val-mapSize">M</span>
      <button class="pxbtn" onclick="adj('mapSize',1)">▶</button>
    </div>
  </div>

  <div class="divider"></div>
  <div class="row" style="flex-direction:column; align-items:flex-start; gap:8px">
    <label>MODO DE JUEGO</label>
    <div class="mode-btns">
      <button class="mode-btn active" data-mode="flags" onclick="setMode(this)">🏳️ BANDERAS</button>
      <button class="mode-btn" data-mode="colors" onclick="setMode(this)">🎨 COLORES</button>
      <button class="mode-btn" data-mode="abstract" onclick="setMode(this)">👾 FIGURAS</button>
    </div>
  </div>
  <div class="row" style="flex-direction:column; align-items:flex-start; gap:8px">
    <label>ESTILO DE MAPA</label>
    <div class="mode-btns">
      <button class="mode-btn style-btn active" data-style="retro" onclick="setMapStyle(this)">🪨 RETRO</button>
      <button class="mode-btn style-btn" data-style="modern" onclick="setMapStyle(this)">✨ MODERN</button>
    </div>
  </div>

  <button id="startBtn" onclick="startGame()">▶ JUGAR</button>
</div>

<!-- ─── GAME ─── -->
<div id="gameWrap">
  <div id="hud">
    <span>VIVOS: <span class="alive" id="hudAlive">0</span></span>
    <span class="timer-hud" id="hudSeed" style="font-size:7px;color:var(--dim)">SEED:0</span>
    <span>BOMBA: <span class="timer-hud" id="hudTimer">0s</span></span>
    <button class="pxbtn" onclick="togglePause()" style="font-size:8px">⏸ PAUSA</button>
  </div>
  <div id="bombTimerBar"><div id="bombTimerFill"></div></div>
  <canvas id="canvas"></canvas>
</div>

<!-- ─── OVERLAY ─── -->
<div id="overlay">
  <div id="overlayBox">
    <div id="overlayTitle">—</div>
    <div id="overlayMsg">—</div>
    <div class="overlay-btns">
      <button class="pxbtn" onclick="restartGame()" style="font-size:9px; padding:10px 16px">↩ REINICIAR</button>
      <button class="pxbtn" onclick="goMenu()" style="font-size:9px; padding:10px 16px">☰ MENÚ</button>
    </div>
  </div>
</div>

  <script src="game.js"></script>
</body>
</html>
